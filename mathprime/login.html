<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MATHORO · Iniciar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden; background: #000;
      font-family: Arial, sans-serif;
    }
    .imagen-full {
      position: relative;
      width: 100vw; height: 100vh;
      background: #000;
    }
    .imagen-full img {
      display: block;
      width: 100%; height: 100%;
      object-fit: fill;
      background: #000;
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none;
    }

    /* FILTRO BRILLANTE + DESTELLOS */
    .capa-brillo {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 5;
      mix-blend-mode: soft-light;
      background: radial-gradient(circle at 50% 40%,
        rgba(255, 230, 170, 0.65) 0%,
        rgba(203, 181, 143, 0.35) 40%,
        transparent 78%);
      animation: respirar 6s ease-in-out infinite;
    }
    @keyframes respirar { 0%,100%{opacity:.8} 50%{opacity:1} }
    .capa-vineta {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 6;
      background: radial-gradient(ellipse at center,
        transparent 55%,
        rgba(101, 50, 27, 0.30) 88%,
        rgba(33, 17, 11, 0.85) 100%);
    }
    .ambiental {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 8;
      overflow: hidden;
    }
    .ambiental span {
      position: absolute; bottom: -10px;
      border-radius: 50%;
      background: #CBB58F;
      box-shadow: 0 0 8px 2px rgba(203, 181, 143, 0.85),
                  0 0 16px 4px rgba(255, 230, 170, 0.45);
      opacity: 0;
      animation: subir linear infinite;
    }
    @keyframes subir {
      0%   { opacity: 0; transform: translateY(0) scale(0.5); }
      20%  { opacity: 0.9; }
      80%  { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-110vh) scale(1.3); }
    }

    /* FADE IN */
    .fade-pagina {
      position: fixed; inset: 0;
      background: #000; z-index: 10000;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.75s ease;
    }
    .fade-pagina.listo { opacity: 0; }
  </style>
</head>
<body>

  <div class="fade-pagina" id="fadeIn"></div>

  <div class="imagen-full">
    <img src="imagenes/iniciarmath3.png" alt="Iniciar">
  </div>

  <div class="capa-brillo"></div>
  <div class="capa-vineta"></div>
  <div class="ambiental" id="ambiental"></div>

  <script>
    (function () {
      const fadeIn = document.getElementById('fadeIn');
      const ambiental = document.getElementById('ambiental');

      function crearDestellos() {
        for (let i = 0; i < 32; i++) {
          const s = document.createElement('span');
          s.style.left = Math.random() * 100 + 'vw';
          s.style.animationDuration = (6 + Math.random() * 8) + 's';
          s.style.animationDelay = (Math.random() * 12) + 's';
          const tam = 2 + Math.random() * 4;
          s.style.width = s.style.height = tam + 'px';
          ambiental.appendChild(s);
        }
      }

      window.addEventListener('load', function () {
        requestAnimationFrame(function () {
          setTimeout(function () { fadeIn.classList.add('listo'); }, 60);
        });
        crearDestellos();
      });
    })();
  </script>
</body>
</html>
