<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nivel 1 · MATHORO</title>
<style>
/* =========================================================
   RESET
   ========================================================= */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    -webkit-user-select: none;
    user-select: none;
}

/* =========================================================
   CONTENEDOR PRINCIPAL (position: relative + inline-block)
   ========================================================= */
.contenedor {
    position: relative;
    display: inline-block;
    max-width: 100vw;
    max-height: 100vh;
    line-height: 0;
}

.contenedor > img.fondo {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
}

/* =========================================================
   1) BARRA DE VIDA  (top:15% left:10% w:55% h:25px)
   ========================================================= */
.barra-vida {
    position: absolute;
    top: 15%;
    left: 10%;
    width: 55%;
    height: 25px;
    background: rgba(35, 20, 10, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.95);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45),
                inset 0 0 8px rgba(0, 0, 0, 0.55);
    line-height: normal;
}

.vida-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(180deg, #8ef58e, #22b14c);
    border-radius: 999px;
    transition: width 0.4s ease, background 0.4s ease;
}

/* =========================================================
   2) PREGUNTA  (top:14% left:76% w:22% h:36%)
   ========================================================= */
.pregunta {
    position: absolute;
    top: 14%;
    left: 76%;
    width: 22%;
    height: 36%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #ffffff;
    font-size: clamp(14px, 3vw, 44px);
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
    line-height: 1.1;
    padding: 4%;
    pointer-events: none;
}

/* =========================================================
   3) BOTONES DE RESPUESTA (6 tarjetas blancas 2×3)
   ========================================================= */
.opcion {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    font-family: inherit;
    font-size: clamp(12px, 2.2vw, 34px);
    font-weight: bold;
    color: #4a2c12;
    cursor: pointer;
    border-radius: 12px;
    line-height: 1;
    transition: background 0.15s ease, transform 0.1s ease, color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
}
.opcion:hover  { background: rgba(255, 255, 255, 0.45); }
.opcion:active { transform: scale(0.94); }
.opcion.correcta   { background: rgba(34, 177, 76, 0.85);  color: #ffffff; }
.opcion.incorrecta { background: rgba(211, 32, 32, 0.85);  color: #ffffff; }

/* Coordenadas exactas */
.opcion[data-index="0"] { top: 58.5%; left: 77.2%; width: 10.2%; height: 8.5%; }
.opcion[data-index="1"] { top: 58.5%; left: 88.5%; width: 10.2%; height: 8.5%; }
.opcion[data-index="2"] { top: 69.0%; left: 77.2%; width: 10.2%; height: 8.5%; }
.opcion[data-index="3"] { top: 69.0%; left: 88.5%; width: 10.2%; height: 8.5%; }
.opcion[data-index="4"] { top: 79.5%; left: 77.2%; width: 10.2%; height: 8.5%; }
.opcion[data-index="5"] { top: 79.5%; left: 88.5%; width: 10.2%; height: 8.5%; }

/* =========================================================
   GAME OVER
   ========================================================= */
.gameover {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: rgba(0, 0, 0, 0.7);
    z-index: 10;
    line-height: normal;
    text-align: center;
    padding: 20px;
}
.gameover.visible { display: flex; }

.gameover h1 {
    color: #fff2d8;
    font-size: clamp(20px, 4vw, 48px);
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.9);
}

.gameover button {
    font-family: inherit;
    font-size: clamp(14px, 1.6vw, 22px);
    font-weight: bold;
    color: #4a2c12;
    background: linear-gradient(180deg, #ffe9a8, #f5b942);
    border: 3px solid #ffffff;
    border-radius: 999px;
    padding: 12px 36px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    transition: transform 0.1s ease;
}
.gameover button:active { transform: scale(0.95); }
</style>
</head>
<body>

<div class="contenedor" id="contenedor">

    <!-- Imagen de fondo: INTACTA -->
    <img class="fondo" src="nivel1.jpg" alt="Fondo nivel 1">

    <!-- Barra de vida -->
    <div class="barra-vida">
        <div class="vida-fill" id="vidaFill"></div>
    </div>

    <!-- Pregunta -->
    <div class="pregunta" id="pregunta">6 × 7 = ?</div>

    <!-- 6 botones transparentes sobre las tarjetas blancas -->
    <button class="opcion" data-index="0" type="button"></button>
    <button class="opcion" data-index="1" type="button"></button>
    <button class="opcion" data-index="2" type="button"></button>
    <button class="opcion" data-index="3" type="button"></button>
    <button class="opcion" data-index="4" type="button"></button>
    <button class="opcion" data-index="5" type="button"></button>

    <!-- Game Over -->
    <div class="gameover" id="gameover">
        <h1>¡Te quedaste sin vida!</h1>
        <button type="button" id="btnReiniciar">Jugar de nuevo</button>
    </div>

</div>

<script>
(function () {
    "use strict";

    /* ==================== CONFIGURACIÓN ==================== */
    const MAX_VIDAS  = 5;
    const MIN_FACTOR = 2;
    const MAX_FACTOR = 10;
    /* ======================================================= */

    const vidaFill   = document.getElementById('vidaFill');
    const pregEl     = document.getElementById('pregunta');
    const opciones   = document.querySelectorAll('.opcion');
    const gameover   = document.getElementById('gameover');
    const btnReini   = document.getElementById('btnReiniciar');

    let vidas     = MAX_VIDAS;
    let correcta  = 0;
    let bloqueado = false;

    const azar = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    function mezclar(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    /* =========================================================
       GENERAR 6 OPCIONES
       ========================================================= */
    function generarOpciones(res, a, b) {
        const set = new Set([res]);

        const candidatos = mezclar([
            res + 1, res - 1,
            res + 2, res - 2,
            res + a, res - a,
            res + b, res - b,
            res + 10, res - 10,
            a * (b + 1), a * (b - 1),
            (a + 1) * b, (a - 1) * b,
            res + 3, res - 3
        ]);

        for (const c of candidatos) {
            if (set.size >= 6) break;
            if (c > 0 && c !== res) set.add(c);
        }

        let extra = res + 4;
        while (set.size < 6) {
            if (extra > 0 && extra !== res) set.add(extra);
            extra++;
        }

        return mezclar([...set]);
    }

    /* =========================================================
       NUEVO EJERCICIO
       ========================================================= */
    function nuevoEjercicio() {
        const a = azar(MIN_FACTOR, MAX_FACTOR);
        const b = azar(MIN_FACTOR, MAX_FACTOR);
        correcta = a * b;

        pregEl.textContent = a + ' × ' + b + ' = ?';

        const valores = generarOpciones(correcta, a, b);

        opciones.forEach(function (btn, i) {
            btn.textContent  = valores[i];
            btn.dataset.valor = valores[i];
            btn.classList.remove('correcta', 'incorrecta');
            btn.disabled = false;
        });

        bloqueado = false;
    }

    /* =========================================================
       RESPUESTA DEL JUGADOR
       ✔ Acierto  -> QUITA vida y avanza a la siguiente pregunta
       ✘ Fallo    -> NO quita vida (se mantiene igual) y avanza
       ========================================================= */
    function responder(btn) {
        if (bloqueado) return;
        bloqueado = true;

        const valor = Number(btn.dataset.valor);

        if (valor === correcta) {
            /* ACIERTO: se resalta en verde y se resta vida */
            btn.classList.add('correcta');
            perderVida();

            setTimeout(function () {
                if (vidas > 0) nuevoEjercicio();
            }, 1000);
        } else {
            /* FALLO: se resalta en rojo, se muestra la correcta,
               pero NO se resta vida */
            btn.classList.add('incorrecta');

            opciones.forEach(function (o) {
                if (Number(o.dataset.valor) === correcta) o.classList.add('correcta');
            });

            setTimeout(function () {
                nuevoEjercicio();
            }, 1000);
        }
    }

    /* =========================================================
       BARRA DE VIDA
       ========================================================= */
    function pintarVida() {
        const pct = (vidas / MAX_VIDAS) * 100;

        vidaFill.style.width = pct + '%';

        let color;
        if (pct > 60)      color = 'linear-gradient(180deg, #8ef58e, #22b14c)';
        else if (pct > 30) color = 'linear-gradient(180deg, #ffd76e, #f0a000)';
        else               color = 'linear-gradient(180deg, #ff8a8a, #d32020)';

        vidaFill.style.background = color;
    }

    function perderVida() {
        vidas = Math.max(0, vidas - 1);
        pintarVida();

        if (vidas === 0) {
            setTimeout(function () {
                gameover.classList.add('visible');
            }, 700);
        }
    }

    /* =========================================================
       REINICIO
       ========================================================= */
    function reiniciar() {
        vidas = MAX_VIDAS;
        pintarVida();
        gameover.classList.remove('visible');
        nuevoEjercicio();
    }

    /* =========================================================
       EVENTOS
       ========================================================= */
    opciones.forEach(function (btn) {
        btn.addEventListener('click', function () { responder(btn); });
    });

    btnReini.addEventListener('click', reiniciar);

    document.addEventListener('keydown', function (e) {
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= 6) {
            const btn = opciones[n - 1];
            if (btn && !btn.disabled) btn.click();
        }
    });

    /* =========================================================
       ARRANQUE
       ========================================================= */
    pintarVida();
    nuevoEjercicio();

})();
</script>

</body>
</html>
