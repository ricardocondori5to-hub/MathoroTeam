<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#740c0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MATHORO · Logros</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #740c0e; }
    .pantalla {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #740c0e;
    }
    .fondo {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }
    .galeria {
      position: absolute;
      inset: 22.8% 8% 3.3%;
      overflow: hidden;
      touch-action: pan-y;
    }
    .pista {
      display: flex;
      width: 200%;
      height: 100%;
      transform: translateX(0);
      transition: transform 520ms cubic-bezier(.22,.78,.25,1);
      will-change: transform;
    }
    .pagina {
      display: grid;
      flex: 0 0 50%;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      column-gap: 2.7vw;
      row-gap: 4vh;
      width: 50%;
      height: 100%;
    }
    .tarjeta {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-radius: 3.2%;
    }
    .tarjeta img {
      position: absolute;
      top: 0;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: translateX(-50%);
    }
    .tarjeta--desbloqueada { background: #740c0e; }
    .tarjeta--desbloqueada img { filter: drop-shadow(0 3px 8px #16070580); }
    .nombre-logro {
      position: absolute;
      right: 31%;
      bottom: 7%;
      left: 31%;
      display: grid;
      min-height: 15%;
      place-items: center;
      padding: 1% 3%;
      border-radius: 6px;
      color: #552b18;
      background: #f5f2ed;
      font-size: clamp(7px, .85vw, 13px);
      font-weight: 900;
      line-height: 1;
      text-align: center;
      text-shadow: none;
      overflow-wrap: anywhere;
    }
    .descripcion { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; }
    .flecha {
      position: absolute;
      z-index: 3;
      top: 49%;
      display: grid;
      width: 5.2vw;
      height: 10vh;
      place-items: center;
      padding: 0;
      border: 0;
      color: #fff1d8;
      background: transparent;
      font: 800 clamp(34px, 5vw, 78px) / 1 Arial, sans-serif;
      text-shadow: 0 3px 3px #30140d, 0 0 13px #8e5435aa;
      cursor: pointer;
      transform: translateY(-50%);
      transition: color .16s ease, transform .16s ease, text-shadow .16s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .flecha:hover:not(:disabled) { color: #fff; text-shadow: 0 0 5px #fff8, 0 3px 5px #7d482b; transform: translateY(-50%) scale(1.12); }
    .flecha:active:not(:disabled) { transform: translateY(-50%) scale(.96); }
    .flecha:focus-visible { outline: 2px solid #fff0d4; outline-offset: 2px; }
    .flecha:disabled { opacity: .26; cursor: default; }
    .flecha--anterior { left: .8%; }
    .flecha--siguiente { right: .8%; }
    .volver {
      position: absolute;
      z-index: 4;
      top: 1.2%;
      right: .5%;
      width: 9%;
      height: 15.2%;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .volver:hover { background: #fff1d210; }
    .volver:focus-visible { outline: 3px solid #fff1d6; outline-offset: 2px; }
    .estado {
      position: absolute;
      z-index: 4;
      right: 10%;
      bottom: 1.1%;
      left: 10%;
      color: #fff1d6;
      font-size: clamp(10px, .9vw, 15px);
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 5px #260906;
      pointer-events: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 700px) {
      .galeria { inset: 22.8% 8% 3.3%; }
      .pagina { column-gap: 2.7vw; row-gap: 4vh; }
      .nombre-logro { font-size: clamp(6px, 1.35vw, 10px); border-radius: 3px; }
      .flecha { width: 6vw; font-size: clamp(28px, 7vw, 48px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pista { transition-duration: .01ms; }
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
  <link rel="stylesheet" href="pwa-responsive.css">
  <link rel="stylesheet" href="transiciones.css">
  <script defer src="pwa-runtime.js"></script>
  <script defer src="transiciones.js"></script>
  <script defer src="sonidos-ui.js"></script>
</head>
<body>
  <main class="pantalla" aria-label="Logros de MATHORO">
    <img class="fondo" src="imagenes/logros.png" alt="Pantalla de logros con nueve espacios ilustrados" draggable="false">
    <div class="galeria" id="galeria" aria-label="Páginas de logros">
      <div class="pista" id="pista" aria-live="polite"></div>
    </div>
    <button class="flecha flecha--anterior" id="anterior" type="button" aria-label="Ver logros anteriores" disabled>&lt;</button>
    <button class="flecha flecha--siguiente" id="siguiente" type="button" aria-label="Ver más logros">&gt;</button>
    <output class="estado" id="estado" role="status" aria-live="polite">Cargando tus logros…</output>
    <button class="volver" id="volver" type="button" aria-label="Volver al menú principal" title="Volver al menú"><span class="sr-only">Volver</span></button>
  </main>

  <script>
    (() => {
      const logros = [
        { id: 'primera-partida', nombre: 'Primera partida', descripcion: 'Termina tu primera partida.' },
        { id: 'campeon', nombre: 'Campeón', descripcion: 'Derrota al jefe y gana una partida.' },
        { id: 'puntaje-1000', nombre: 'Mil puntos', descripcion: 'Consigue 1.000 puntos en una partida.' },
        { id: 'puntaje-3000', nombre: 'Tres mil puntos', descripcion: 'Consigue 3.000 puntos en una partida.' },
        { id: 'puntaje-5000', nombre: 'Cinco mil puntos', descripcion: 'Consigue 5.000 puntos en una partida.' },
        { id: 'cinco-partidas', nombre: 'Constante', descripcion: 'Termina cinco partidas.' },
        { id: 'diez-partidas', nombre: 'Veterano', descripcion: 'Termina diez partidas.' },
        { id: 'tres-victorias', nombre: 'Tricampeón', descripcion: 'Gana tres partidas.' },
        { id: 'diez-victorias', nombre: 'Leyenda', descripcion: 'Gana diez partidas.' },
        { id: 'combo-5', nombre: 'Combo x5', descripcion: 'Alcanza un combo de cinco respuestas.' },
        { id: 'combo-10', nombre: 'Combo x10', descripcion: 'Alcanza un combo de diez respuestas.' },
        { id: 'combo-15', nombre: 'Combo x15', descripcion: 'Alcanza un combo de quince respuestas.' },
        { id: 'primer-rayo', nombre: 'Rayo matemático', descripcion: 'Usa el Rayo Matemático por primera vez.' },
        { id: 'cinco-rayos', nombre: 'Cinco rayos', descripcion: 'Usa el Rayo Matemático cinco veces.' },
        { id: 'reflejos', nombre: 'Reflejos rápidos', descripcion: 'Responde rápido y gana puntos extra.' },
        { id: 'mente-matematica', nombre: 'Mente matemática', descripcion: 'Responde correctamente 25 preguntas.' },
        { id: 'sin-perder-vidas', nombre: 'Sin perder vidas', descripcion: 'Gana una partida conservando al menos 18 vidas.' },
        { id: 'acumulador', nombre: 'Acumulador', descripcion: 'Acumula 10.000 puntos entre tus partidas.' }
      ];
      const pista = document.getElementById('pista');
      const anterior = document.getElementById('anterior');
      const siguiente = document.getElementById('siguiente');
      const estado = document.getElementById('estado');
      let paginaActual = 0;
      let inicioDeslizamiento = null;
      const paginas = [];

      for (let pagina = 0; pagina < 2; pagina += 1) {
        const grid = document.createElement('section');
        grid.className = 'pagina';
        grid.setAttribute('aria-label', `Página ${pagina + 1} de logros`);
        logros.slice(pagina * 9, pagina * 9 + 9).forEach((logro) => {
          const card = document.createElement('article');
          card.className = 'tarjeta';
          card.dataset.logro = logro.id;
          card.title = `${logro.nombre}: ${logro.descripcion}`;
          card.setAttribute('aria-label', `${logro.nombre}. Bloqueado. ${logro.descripcion}`);
          grid.appendChild(card);
        });
        paginas.push(grid);
        pista.appendChild(grid);
      }

      function irA(indice) {
        paginaActual = Math.max(0, Math.min(1, indice));
        pista.style.transform = `translateX(-${paginaActual * 50}%)`;
        anterior.disabled = paginaActual === 0;
        siguiente.disabled = paginaActual === 1;
        estado.dataset.pagina = `${paginaActual + 1} de 2`;
        estado.textContent = `${estado.dataset.mensaje || 'Inicia sesión para guardar tus logros.'} · Página ${paginaActual + 1} de 2`;
      }

      function actualizarTarjetas(ids) {
        const desbloqueados = new Set(ids);
        pista.querySelectorAll('.tarjeta').forEach((card) => {
          const logro = logros.find((item) => item.id === card.dataset.logro);
          if (!logro || !desbloqueados.has(logro.id)) return;
          card.classList.add('tarjeta--desbloqueada');
          card.setAttribute('aria-label', `${logro.nombre}. Desbloqueado. ${logro.descripcion}`);
          const ilustracion = document.createElement('img');
          ilustracion.src = 'imagenes/logro-campeon.png';
          ilustracion.alt = '';
          ilustracion.draggable = false;
          const etiqueta = document.createElement('span');
          etiqueta.className = 'nombre-logro';
          etiqueta.textContent = logro.nombre;
          card.replaceChildren(ilustracion, etiqueta);
        });
      }

      async function cargarLogros() {
        try {
          const response = await fetch('/api/achievements', { cache: 'no-store', credentials: 'same-origin' });
          if (response.status === 401) {
            estado.dataset.mensaje = 'Inicia sesión para guardar y consultar tus logros.';
            irA(paginaActual);
            return;
          }
          const data = await readApiJson(response);
          if (!response.ok) throw new Error(data.error || 'No se pudieron cargar los logros.');
          const ids = (data.achievements || []).map((item) => item.achievement_id);
          actualizarTarjetas(ids);
          estado.dataset.mensaje = `${ids.length} de ${logros.length} logros desbloqueados`;
          irA(paginaActual);
        } catch (error) {
          estado.dataset.mensaje = error instanceof TypeError
            ? 'Inicia server.py para cargar los logros de tu cuenta.'
            : error.message;
          irA(paginaActual);
        }
      }

      async function readApiJson(response) {
        if (!(response.headers.get('content-type') || '').includes('application/json')) {
          throw new Error('El servidor respondió con HTML en vez de JSON. Ejecuta iniciar_mathoro.bat y abre el juego desde localhost.');
        }
        try { return await response.json(); }
        catch { throw new Error('El servidor envió JSON inválido. Reinicia MATHORO con iniciar_mathoro.bat.'); }
      }

      anterior.addEventListener('click', () => irA(paginaActual - 1));
      siguiente.addEventListener('click', () => irA(paginaActual + 1));
      document.getElementById('volver').addEventListener('click', () => { window.navegarConFade('empiezo.html'); });
      document.getElementById('galeria').addEventListener('pointerdown', (event) => { inicioDeslizamiento = event.clientX; });
      document.getElementById('galeria').addEventListener('pointerup', (event) => {
        if (inicioDeslizamiento === null) return;
        const diferencia = event.clientX - inicioDeslizamiento;
        inicioDeslizamiento = null;
        if (Math.abs(diferencia) < 55) return;
        irA(paginaActual + (diferencia < 0 ? 1 : -1));
      });
      document.getElementById('galeria').addEventListener('pointercancel', () => { inicioDeslizamiento = null; });
      cargarLogros();
    })();
  </script>
</body>
</html>
