<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#51060e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MATHORO · Empiezo</title>
  <script defer src="preferencias.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden; background: #000;
      font-family: Arial, sans-serif;
    }

    .imagen-container {
      position: relative;
      width: 100vw; height: 100vh;
      background: #000; overflow: hidden;
    }
    .imagen-container img.fondo-jugar {
      display: block; width: 100%; height: 100%;
      object-fit: fill;
      background: #000;
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none;
    }

    #ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
    }

    .hitbox {
      position: absolute;
      display: block;
      background: transparent;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hitbox:focus-visible { outline: 3px solid #fff2d6; outline-offset: 3px; }

    .frase-motivacional {
      position: absolute;
      z-index: 11;
      top: 78.5%;
      left: 50%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(3px, .4vw, 9px);
      width: 100%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      font-size: clamp(14px, 3.4vw, 62px);
      font-weight: 900;
      pointer-events: none;
      transition: opacity .25s ease;
    }
    .frase-motivacional.cambiando { opacity: 0; }
    .frase-texto {
      color: #fff;
      font: inherit;
      -webkit-text-stroke: 2.5px #fff;
      paint-order: stroke fill;
      line-height: .98;
      text-align: center;
      text-transform: uppercase;
      white-space: pre-line;
      text-shadow: none;
    }
    .frase-cuernito { display: block; flex: 0 0 auto; width: auto; height: 1em; margin-top: .02em; object-fit: contain; }
    @media (prefers-reduced-motion: reduce) { .frase-motivacional { transition: none; } }

  </style>
  <link rel="stylesheet" href="pwa-responsive.css">
  <link rel="stylesheet" href="transiciones.css">
  <link rel="stylesheet" href="ambiente.css">
  <script defer src="pwa-runtime.js"></script>
  <script defer src="transiciones.js"></script>
  <script defer src="ambiente.js"></script>
  <script defer src="sonidos-ui.js"></script>
</head>
<body>

  <div class="imagen-container">
    <img src="imagenes/empiezomath.png" alt="Empiezo" class="fondo-jugar">
  </div>

  <div id="ui-layer">
    <a id="btnRecomp" class="hitbox" href="recomp.html" aria-label="Recomp" title="Recomp" style="left: 18%; top: 5%; width: 26%; height: 25%;"></a>
    <a id="btnLogros" class="hitbox" href="logros.html" aria-label="Logros" title="Logros" style="left: 60%; top: 7%; width: 22%; height: 23%;"></a>
    <a id="btnRanking" class="hitbox" href="ranking.html" aria-label="Ranking" title="Ranking" style="left: 16.5%; top: 45%; width: 28%; height: 14%;"></a>
    <a id="btnSala" class="hitbox" href="jugar.html" aria-label="Sala" title="Ir a la sala" style="left: 66.5%; top: 45%; width: 18%; height: 14%;"></a>
    <a id="btnRegresar" class="hitbox" href="index.html" aria-label="Volver al menú principal" title="Volver al menú" style="left: 90.5%; top: 2%; width: 8%; height: 13%;"></a>
  </div>
  <p class="frase-motivacional" id="fraseMotivacional">
    <img class="frase-cuernito" src="imagenes/cuerno-frase-izquierda.png" alt="" draggable="false">
    <span class="frase-texto" id="fraseTexto">VOS PODES LLEGAR<br>MUY LEJOS</span>
    <img class="frase-cuernito" src="imagenes/cuerno-frase-derecha.png" alt="" draggable="false">
  </p>

  <script>
    (function () {
      window.addEventListener('load', function () {
        const pre = new Image();
        pre.src = 'imagenes/empiezomath.png';
      });

      const frase = document.getElementById('fraseMotivacional');
      const textoFrase = document.getElementById('fraseTexto');
      const frases = [
        'VOS PODES LLEGAR\nMUY LEJOS',
        'DALE QUE HOY\nLA ROMPES',
        'UN PASO MAS\nY LO LOGRAS',
        'CONFIA EN TODO\nLO QUE SABES',
        'SEGUI, CADA VEZ\nESTAS MAS CERCA',
        'HOY ES UN GRAN DIA\nPARA GANAR'
      ];
      const claveUltimaFrase = 'mathoro-ultima-frase-empiezo';
      let ultimaFrase = -1;
      try { ultimaFrase = Number(sessionStorage.getItem(claveUltimaFrase) ?? -1); } catch (_) {}
      let indiceFrase = Math.floor(Math.random() * frases.length);
      if (frases.length > 1 && indiceFrase === ultimaFrase) {
        indiceFrase = (indiceFrase + 1 + Math.floor(Math.random() * (frases.length - 1))) % frases.length;
      }
      textoFrase.textContent = frases[indiceFrase];
      try { sessionStorage.setItem(claveUltimaFrase, String(indiceFrase)); } catch (_) {}
      window.setInterval(() => {
        frase.classList.add('cambiando');
        window.setTimeout(() => {
          let siguienteFrase = Math.floor(Math.random() * frases.length);
          if (frases.length > 1 && siguienteFrase === indiceFrase) {
            siguienteFrase = (siguienteFrase + 1 + Math.floor(Math.random() * (frases.length - 1))) % frases.length;
          }
          indiceFrase = siguienteFrase;
          textoFrase.textContent = frases[indiceFrase];
          try { sessionStorage.setItem(claveUltimaFrase, String(indiceFrase)); } catch (_) {}
          frase.classList.remove('cambiando');
        }, 250);
      }, 4000);

    })();
  </script>
</body>
</html>
