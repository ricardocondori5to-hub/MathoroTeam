<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#790d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MATHORO · Ranking</title>
  <script defer src="preferencias.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #790d10; }
    .pantalla {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #790d10;
    }
    .arte {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }
    .podio {
      position: absolute;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(3px, .55vh, 7px);
      padding: 1.2%;
      color: #fff3df;
      text-align: center;
      text-shadow: 0 1px 4px #29130c;
      overflow: hidden;
    }
    .podio--primero { left: 13.2%; top: 23.5%; width: 8.4%; height: 23%; }
    .podio--segundo { left: 4.2%; top: 29%; width: 7.9%; height: 18%; }
    .podio--tercero { left: 22.5%; top: 29%; width: 7.9%; height: 18%; }
    .podio .puesto { font-size: clamp(9px, .85vw, 15px); font-weight: 800; color: #f4d39e; }
    .podio .jugador { max-width: 100%; font-size: clamp(9px, .92vw, 17px); font-weight: 800; overflow-wrap: anywhere; }
    .podio .puntos { font-size: clamp(11px, 1.25vw, 21px); font-weight: 900; }
    .podio--cuarto { left: 3.4%; top: 54.5%; width: 28%; height: 8.3%; }
    .podio--quinto, .podio--sexto, .podio--septimo, .podio--octavo { width: 13.4%; height: 8.2%; }
    .podio--cuarto, .podio--quinto, .podio--sexto, .podio--septimo, .podio--octavo {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
      justify-content: stretch; gap: clamp(5px, .65vw, 11px); padding: 0 4%; text-align: left;
    }
    .identidad-podio { display: flex; align-items: center; gap: clamp(4px, .55vw, 9px); min-width: 0; }
    .identidad-podio .puesto { flex: 0 0 auto; font-size: clamp(10px, .9vw, 15px); white-space: nowrap; }
    .identidad-podio .jugador { min-width: 0; overflow: hidden; font-size: clamp(11px, 1.05vw, 17px); text-overflow: ellipsis; white-space: nowrap; }
    .podio--cuarto .puntos, .podio--quinto .puntos, .podio--sexto .puntos, .podio--septimo .puntos, .podio--octavo .puntos {
      justify-self: end; margin: 0; font-size: clamp(10px, 1vw, 16px); line-height: 1; white-space: nowrap;
    }
    .podio--quinto { left: 3.5%; top: 68.7%; }
    .podio--sexto { left: 18.2%; top: 68.7%; }
    .podio--septimo { left: 3.5%; top: 82.4%; }
    .podio--octavo { left: 18.2%; top: 82.4%; }
    .podio--cuarto .puesto, .podio--quinto .puesto, .podio--sexto .puesto, .podio--septimo .puesto, .podio--octavo .puesto { font-size: clamp(10px, .9vw, 15px); line-height: 1; }
    .podio--cuarto .jugador, .podio--quinto .jugador, .podio--sexto .jugador, .podio--septimo .jugador, .podio--octavo .jugador { max-width: 100%; font-size: clamp(11px, 1.05vw, 17px); line-height: 1.05; }
    .podio--cuarto .puntos, .podio--quinto .puntos, .podio--sexto .puntos, .podio--septimo .puntos, .podio--octavo .puntos { font-size: clamp(10px, 1vw, 16px); line-height: 1; white-space: nowrap; }

    .lista {
      position: absolute;
      z-index: 2;
      top: 18.75%;
      right: 5.35%;
      bottom: 3.1%;
      left: 34.85%;
      display: flex;
      flex-direction: column;
      gap: 2.15vh;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      overscroll-behavior: contain;
    }
    .lista::-webkit-scrollbar { display: none; }
    .fila {
      display: grid;
      flex: 0 0 7.8vh;
      grid-template-columns: 15.2% minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(7px, 1.1vw, 18px);
      min-height: 54px;
      padding: 0 1.5% 0 0;
      overflow: hidden;
      border: clamp(3px, .28vw, 5px) solid #27130d;
      border-radius: clamp(15px, 1.7vw, 30px);
      color: #fff5e7;
      background: linear-gradient(100deg, #57321f 0%, #603820 100%);
      box-shadow: inset 0 0 0 2px #9a68454d, 0 2px 8px #220a08;
    }
    .insignias-hover { position: fixed; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; width: max-content; max-width: min(80vw, 520px); max-height: min(42vh, 260px); overflow: auto; min-height: 54px; padding: 8px 12px; border: 2px solid #d4ae78; border-radius: 14px; background: #28130df2; box-shadow: 0 5px 18px #120704b8; pointer-events: none; }
    .insignias-hover[hidden] { display: none; }
    .insignias-hover img { width: clamp(28px, 4vw, 48px); height: clamp(28px, 4vw, 48px); object-fit: contain; }
    .numero {
      display: grid;
      align-self: stretch;
      place-items: center;
      border-right: 2px solid #3a1d12;
      color: #fff7ed;
      background: linear-gradient(90deg, #4c2919, #59321e);
      font-size: clamp(19px, 2vw, 34px);
      font-weight: 900;
      text-shadow: 0 2px 3px #21100a;
    }
    .nombre {
      min-width: 0;
      overflow: hidden;
      font-size: clamp(12px, 1.15vw, 20px);
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 3px #28130b;
    }
    .puntos-lista {
      padding-right: 1%;
      color: #ffe0a5;
      font-size: clamp(11px, 1.05vw, 18px);
      font-weight: 900;
      white-space: nowrap;
    }
    .vacio {
      position: absolute;
      top: 48%;
      left: 34.9%;
      width: 59%;
      color: #fff2dc;
      font-size: clamp(14px, 1.3vw, 22px);
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 7px #250a08;
    }
    .boton-imagen {
      position: absolute;
      z-index: 4;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .volver { top: .4%; right: .6%; width: 9.2%; height: 15.6%; border-radius: 50%; }
    .volver img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .refrescar { top: 17.8%; right: .4%; width: 3.4%; height: 6.8%; border-radius: 50%; }
    .abajo { right: .4%; bottom: 1.4%; width: 3.4%; height: 5.1%; border-radius: 50%; }
    .boton-imagen:hover { background: #fff1d212; }
    .boton-imagen:active { transform: scale(.96); }
    .boton-imagen:focus-visible { outline: 3px solid #fff1d6; outline-offset: 2px; }
    .estado {
      position: absolute;
      z-index: 3;
      bottom: 1.2%;
      left: 2%;
      max-width: 30%;
      color: #fff0d4;
      font-size: clamp(10px, .85vw, 14px);
      font-weight: 700;
      text-shadow: 0 1px 5px #220a08;
    }
    .lector {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }
    @media (max-width: 700px) {
      .podio { gap: 2px; }
      .podio .puesto { font-size: clamp(7px, 1.4vw, 10px); }
      .podio .jugador { font-size: clamp(7px, 1.55vw, 11px); }
      .podio .puntos { font-size: clamp(8px, 1.9vw, 13px); }
      .fila { min-height: 34px; grid-template-columns: 15% minmax(0, 1fr) auto; gap: 4px; }
      .numero { font-size: clamp(14px, 3vw, 22px); }
      .nombre, .puntos-lista { font-size: clamp(8px, 1.7vw, 12px); }
      .podio--cuarto, .podio--quinto, .podio--sexto, .podio--septimo, .podio--octavo { gap: 4px; padding-inline: 3%; text-align: left; }
      .podio--cuarto .puesto, .podio--quinto .puesto, .podio--sexto .puesto, .podio--septimo .puesto, .podio--octavo .puesto { font-size: clamp(8px, 1.4vw, 11px); line-height: 1; }
      .podio--cuarto .jugador, .podio--quinto .jugador, .podio--sexto .jugador, .podio--septimo .jugador, .podio--octavo .jugador { font-size: clamp(9px, 1.6vw, 13px); line-height: 1; }
      .podio--cuarto .puntos, .podio--quinto .puntos, .podio--sexto .puntos, .podio--septimo .puntos, .podio--octavo .puntos { font-size: clamp(8px, 1.4vw, 11px); line-height: 1; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
  <link rel="stylesheet" href="pwa-responsive.css">
  <link rel="stylesheet" href="transiciones.css">
  <link rel="stylesheet" href="ambiente.css">
  <script defer src="pwa-runtime.js"></script>
  <script defer src="transiciones.js"></script>
  <script defer src="ambiente.js"></script>
  <script defer src="sonidos-ui.js"></script>
</head>
<body>
  <main class="pantalla" aria-label="Ranking de MATHORO">
    <img class="arte" src="imagenes/rankingg.png" alt="Ranking de MATHORO a pantalla completa" draggable="false">
    <section id="podio" aria-label="Los ocho mejores puntajes"></section>
    <section class="lista" id="lista" aria-label="Puntajes desde el noveno lugar" aria-live="polite"></section>
    <aside class="insignias-hover" id="insigniasHover" role="tooltip" hidden></aside>
    <p class="vacio" id="vacio" hidden>Todavía no hay puntajes guardados. ¡Juega una partida para inaugurar el ranking!</p>
    <output class="estado" id="estado" role="status" aria-live="polite">Cargando ranking…</output>

    <button class="boton-imagen volver" id="volver" type="button" aria-label="Volver a la pantalla anterior" title="Volver a la pantalla anterior"><img src="imagenes/volver-atras.png" alt="" draggable="false"><span class="lector">Volver</span></button>
    <button class="boton-imagen refrescar" id="refrescar" type="button" aria-label="Actualizar ranking" title="Actualizar ranking"><span class="lector">Actualizar</span></button>
    <button class="boton-imagen abajo" id="abajo" type="button" aria-label="Ver las últimas posiciones" title="Ver las últimas posiciones"><span class="lector">Ver últimas posiciones</span></button>
  </main>

  <script>
    (() => {
      const podio = document.getElementById('podio');
      const lista = document.getElementById('lista');
      const vacio = document.getElementById('vacio');
      const estado = document.getElementById('estado');
      const insigniasHover = document.getElementById('insigniasHover');
      const insignias = {
        campeon: ['Campeón', 'ranking-insignia-campeon.png'], exponencial: ['Exponencial', 'ranking-insignia-exponencial.png'], fiuuu: ['Fiuuuuuh', 'ranking-insignia-fiuuu.png'], indeciso: ['¿Indeciso?', 'ranking-insignia-indeciso.png'], 'lo-lograste': ['¡Lo lograste!', 'ranking-insignia-lo-lograste.png'], 'que-defensa': ['¡Qué defensa!', 'ranking-insignia-que-defensa.png'],
        'campeon-ii': ['Campeón II', 'ranking-insignia-campeon.png'], 'primera-partida': ['Racha inicial', 'ranking-insignia-exponencial.png'], 'puntaje-1000': ['Dos mil puntos', 'ranking-insignia-fiuuu.png'], 'puntaje-3000': ['Cuatro mil puntos', 'ranking-insignia-indeciso.png'], 'puntaje-5000': ['Seis mil puntos', 'ranking-insignia-lo-lograste.png'], 'cinco-partidas': ['Constante', 'ranking-insignia-que-defensa.png'], 'diez-partidas': ['Veterano', 'ranking-insignia-campeon.png'], 'tres-victorias': ['Cinco victorias', 'ranking-insignia-exponencial.png'], 'diez-victorias': ['Leyenda', 'ranking-insignia-fiuuu.png'], 'combo-5': ['Combo x8', 'ranking-insignia-indeciso.png'], 'combo-10': ['Combo x12', 'ranking-insignia-lo-lograste.png'], 'combo-15': ['Combo x18', 'ranking-insignia-que-defensa.png'], 'primer-rayo': ['Rayo matemático', 'ranking-insignia-fiuuu.png'], 'cinco-rayos': ['Diez rayos', 'ranking-insignia-exponencial.png'], reflejos: ['Reflejos rápidos', 'ranking-insignia-indeciso.png'], 'mente-matematica': ['Mente matemática', 'ranking-insignia-lo-lograste.png'], 'sin-perder-vidas': ['Sin perder vidas', 'ranking-insignia-que-defensa.png'], acumulador: ['Acumulador', 'ranking-insignia-campeon.png']
      };
      // Datos de muestra temporales: solo aparecen en pantalla y no se guardan en la base de datos.
      const usuariosDemo = [
        { username: 'mati_14', score: 5200, achievements: ['campeon', 'indeciso'] },
        { username: 'tomi_gamer', score: 4800, achievements: ['exponencial', 'que-defensa'] },
        { username: 'lucho123', score: 4350, achievements: ['fiuuu', 'lo-lograste'] },
        { username: 'franplay', score: 3900, achievements: ['campeon', 'que-defensa'] },
        { username: 'nachito', score: 3550, achievements: ['indeciso', 'exponencial'] },
        { username: 'benja14', score: 3200, achievements: ['campeon', 'fiuuu'] },
        { username: 'agus_xd', score: 2950, achievements: ['lo-lograste', 'indeciso'] },
        { username: 'santi.exe', score: 2700, achievements: ['que-defensa', 'exponencial'] },
        { username: 'maxi_boss', score: 2450, achievements: ['campeon', 'lo-lograste'] },
        { username: 'joaco2000', score: 2200, achievements: ['fiuuu', 'indeciso'] },
        { username: 'fedepro', score: 1950, achievements: ['exponencial', 'que-defensa'] },
        { username: 'nico_gol', score: 1700, achievements: ['campeon', 'indeciso'] },
        { username: 'pablito', score: 1500, achievements: ['lo-lograste', 'fiuuu'] },
        { username: 'rulo_14', score: 1300, achievements: ['que-defensa', 'campeon'] },
        { username: 'martuplay', score: 1100, achievements: ['indeciso', 'exponencial'] },
        { username: 'mili_gamer', score: 900, achievements: ['campeon', 'lo-lograste'] },
        { username: 'cami123', score: 750, achievements: ['fiuuu', 'que-defensa'] },
        { username: 'vale_xd', score: 600, achievements: ['exponencial', 'indeciso'] },
        { username: 'lola_games', score: 450, achievements: ['campeon', 'fiuuu'] },
        { username: 'rochi14', score: 300, achievements: ['lo-lograste', 'que-defensa'] }
      ];

      function textoSeguro(tag, className, text) {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = text;
        return element;
      }

      function mostrarInsignias(entry, target) {
        insigniasHover.replaceChildren();
        const owned = [...new Set(entry.achievements || [])].filter(id => insignias[id]);
        owned.forEach(id => { const item = insignias[id], img = document.createElement('img'); img.src = 'imagenes/' + item[1]; img.alt = item[0]; img.title = item[0]; insigniasHover.appendChild(img); });
        if (!owned.length) insigniasHover.textContent = 'Todavia no tiene insignias';
        insigniasHover.hidden = false;
        const rect = target.getBoundingClientRect(), width = insigniasHover.offsetWidth, height = insigniasHover.offsetHeight;
        insigniasHover.style.left = Math.max(12, Math.min(rect.left + rect.width / 2 - width / 2, innerWidth - width - 12)) + 'px';
        insigniasHover.style.top = Math.max(12, Math.min(rect.bottom + 8, innerHeight - height - 12)) + 'px';
      }
      function ocultarInsignias() { insigniasHover.hidden = true; }

      function renderPodio(entries) {
        podio.replaceChildren();
        const places = [
          'podio--primero', 'podio--segundo', 'podio--tercero', 'podio--cuarto',
          'podio--quinto', 'podio--sexto', 'podio--septimo', 'podio--octavo'
        ];
        places.forEach((className, index) => {
          const place = index + 1;
          const entry = entries[place - 1];
          if (!entry) return;
          const card = document.createElement('article');
          card.className = `podio ${className}`;
          card.setAttribute('aria-label', `Puesto ${place}: ${entry.username}, ${entry.score} puntos`);
          const numeroPuesto = textoSeguro('span', 'puesto', '#' + place);
          const nombreJugador = textoSeguro('span', 'jugador', entry.username);
          const puntosJugador = textoSeguro('span', 'puntos', String(entry.score) + ' pts');
          if (place >= 4) {
            const identidad = document.createElement('div');
            identidad.className = 'identidad-podio';
            identidad.append(numeroPuesto, nombreJugador);
            card.append(identidad, puntosJugador);
          } else {
            card.append(numeroPuesto, nombreJugador, puntosJugador);
          }
          card.tabIndex = 0;
          card.addEventListener('pointerenter', () => mostrarInsignias(entry, card)); card.addEventListener('pointerleave', ocultarInsignias);
          card.addEventListener('focusin', () => mostrarInsignias(entry, card)); card.addEventListener('focusout', ocultarInsignias);
          podio.appendChild(card);
        });
      }

      function renderLista(entries) {
        lista.replaceChildren();
        entries.slice(8).forEach((entry, index) => {
          const rank = index + 9;
          const row = document.createElement('article');
          row.className = 'fila';
          row.setAttribute('aria-label', `Puesto ${rank}: ${entry.username}, ${entry.score} puntos`);
          row.append(
            textoSeguro('span', 'numero', String(rank)),
            textoSeguro('span', 'nombre', entry.username),
            textoSeguro('span', 'puntos-lista', `${entry.score} pts`)
          );
          row.tabIndex = 0;
          row.addEventListener('pointerenter', () => mostrarInsignias(entry, row)); row.addEventListener('pointerleave', ocultarInsignias);
          row.addEventListener('focusin', () => mostrarInsignias(entry, row)); row.addEventListener('focusout', ocultarInsignias);
          lista.appendChild(row);
        });
      }

      async function cargarRanking() {
        estado.textContent = 'Cargando ranking…';
        try {
          const [scoresResponse, meResponse, achievementsResponse] = await Promise.all([
            fetch('/api/leaderboard', { cache: 'no-store', credentials: 'same-origin' }),
            fetch('/api/me', { cache: 'no-store', credentials: 'same-origin' }),
            fetch('/api/achievements', { cache: 'no-store', credentials: 'same-origin' })
          ]);
          const ranking = await readApiJson(scoresResponse);
          if (!scoresResponse.ok) throw new Error(ranking.error || 'No se pudo cargar el ranking.');
          const current = meResponse.ok ? await readApiJson(meResponse) : null;
          const reales = (Array.isArray(ranking.scores) ? ranking.scores : []).map(entry => ({ ...entry, achievements: Array.isArray(entry.achievements) ? entry.achievements : [] }));
          if (current?.authenticated && achievementsResponse.ok) {
            const accountData = await readApiJson(achievementsResponse);
            const myAchievements = (accountData.achievements || []).map(item => typeof item === 'string' ? item : item.achievement_id).filter(Boolean);
            const myEntry = reales.find(entry => entry.username === current.user.username);
            if (myEntry) myEntry.achievements = [...new Set([...myEntry.achievements, ...myAchievements])];
            else if (myAchievements.length) reales.push({ username: current.user.username, score: 0, games: 0, achievements: myAchievements });
          }
          const scores = [...reales, ...usuariosDemo].sort((a, b) => Number(b.score) - Number(a.score));
          renderPodio(scores);
          renderLista(scores);
          vacio.hidden = scores.length > 0;
          if (current?.authenticated) {
            const place = scores.findIndex((item) => item.username === current.user.username);
            estado.textContent = place >= 0
              ? `Sesión: ${current.user.username} · Puesto ${place + 1} · Mejor puntaje: ${scores[place].score}`
              : `Sesión: ${current.user.username} · Aún no tienes un puntaje registrado`;
          } else {
            estado.textContent = 'Inicia sesión para guardar tus puntajes.';
          }
        } catch (error) {
          renderPodio([]);
          renderLista([]);
          vacio.hidden = false;
          vacio.textContent = 'No se pudo conectar con la base de datos. Ejecuta iniciar_mathoro.bat y abre el juego desde localhost.';
          estado.textContent = error instanceof TypeError ? 'Servidor sin conexión' : error.message;
        }
      }

      async function readApiJson(response) {
        if (!(response.headers.get('content-type') || '').includes('application/json')) {
          throw new Error('El servidor respondió con HTML en vez de JSON. Cierra el servidor incorrecto y ejecuta iniciar_mathoro.bat.');
        }
        try { return await response.json(); }
        catch { throw new Error('El servidor envió JSON inválido. Reinicia MATHORO con iniciar_mathoro.bat.'); }
      }

      document.getElementById('volver').addEventListener('click', () => { window.navegarConFade('empiezo.html'); });
      document.getElementById('refrescar').addEventListener('click', cargarRanking);
      document.getElementById('abajo').addEventListener('click', () => lista.scrollTo({ top: lista.scrollHeight, behavior: 'smooth' }));
      cargarRanking();
    })();
  </script>
</body>
</html>
