<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#65090d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Recompensas | MATHORO</title>
  <style>
    :root { color-scheme: dark; --cream: #fff4df; --brown: #512b19; --dark-brown: #29130e; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: "Trebuchet MS", Arial, sans-serif; color: var(--cream); background: #65090d; }
    .scene { position: relative; width: 100vw; height: 100vh; min-height: 360px; overflow: hidden; isolation: isolate; }
    .backdrop { position: absolute; z-index: -2; inset: 0; width: 100%; height: 100%; object-fit: fill; user-select: none; pointer-events: none; }
    .shade { position: absolute; z-index: -1; inset: 0; background: radial-gradient(ellipse at center, transparent 24%, rgba(31, 0, 3, .14) 100%); pointer-events: none; }
    .back-button { position: absolute; z-index: 4; top: 2.2%; right: 1.7%; display: block; width: clamp(92px, 9vw, 150px); line-height: 0; border: 0; border-radius: 50%; background: transparent; filter: drop-shadow(0 4px 7px rgba(28, 5, 2, .45)); text-decoration: none; transition: transform .16s ease, filter .16s ease; }
    .back-button img { display: block; width: 100%; height: auto; }
    .back-button:hover { transform: translateY(-2px) scale(1.05); filter: drop-shadow(0 6px 9px rgba(28, 5, 2, .6)) brightness(1.08); }
    .back-button:active { transform: scale(.96); }
    .reward-display { position: absolute; left: 50%; top: 47.5%; width: min(34vw, 510px); min-width: 250px; transform: translate(-50%, -50%); text-align: center; filter: drop-shadow(0 4px 8px rgba(26, 4, 3, .75)); }
    .reward-card { display: grid; justify-items: center; gap: clamp(5px, 1.3vh, 14px); padding: clamp(9px, 1.5vw, 20px); animation: arrive .32s ease both; }
    .reward-card.slide-left { animation-name: arrive-left; }
    .reward-card.slide-right { animation-name: arrive-right; }
    .lock-plate { display: grid; place-items: center; width: clamp(76px, 9vw, 132px); aspect-ratio: 1; border: 4px solid #32180e; border-radius: 28%; background: linear-gradient(145deg, #f8e9cd, #d5b78d); box-shadow: inset 0 0 0 3px rgba(108, 62, 32, .32), 0 7px 0 #32180e; }
    .lock-plate svg { width: 64%; height: 64%; color: #542d1a; }
    .reward-name { margin: 2px 0 0; font-size: clamp(1.15rem, 2.7vw, 2.25rem); line-height: 1.05; font-weight: 900; color: #fff3df; text-shadow: 0 3px 0 #37110d, 0 0 9px rgba(38, 0, 0, .8); }
    .reward-description { max-width: 34ch; min-height: 1.2em; margin: 0; font-size: clamp(.8rem, 1.3vw, 1.08rem); font-weight: 700; color: #f1dfc7; text-shadow: 0 2px 4px #300609; }
    .reward-status { min-height: 1.4em; margin: 0; font-size: clamp(.74rem, 1.1vw, .95rem); font-weight: 800; color: #ffe5ad; text-shadow: 0 2px 4px #260608; }
    .reward-status.error { color: #fff0ee; }
    .claim-hitbox:focus-visible, .back-button:focus-visible { outline: 3px solid #fff4df; outline-offset: 4px; }
    .claim-hitbox { position: absolute; z-index: 2; left: 35.2%; top: 74.6%; width: 29.6%; height: 17.5%; border: 0; border-radius: 22px; background: transparent; cursor: pointer; }
    .claim-hitbox:hover { background: rgba(255, 247, 229, .1); }
    .claim-hitbox:active { background: rgba(91, 37, 23, .12); }
    .claim-hitbox:disabled { cursor: default; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes arrive { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes arrive-left { from { opacity: 0; transform: translateX(38px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes arrive-right { from { opacity: 0; transform: translateX(-38px); } to { opacity: 1; transform: translateX(0); } }
    @media (max-width: 650px) {
      .reward-display { top: 48%; width: 56vw; min-width: 0; }
      .claim-hitbox { left: 27%; top: 75%; width: 46%; height: 18%; }
      .back-button { top: 1.4%; right: 2%; width: clamp(72px, 16vw, 110px); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
  <link rel="stylesheet" href="pwa-responsive.css">
  <link rel="stylesheet" href="transiciones.css">
  <script defer src="pwa-runtime.js"></script>
  <script defer src="transiciones.js"></script>
  <script defer src="sonidos-ui.js"></script>
</head>
<body>
  <main class="scene" aria-label="Catálogo de recompensas">
    <img class="backdrop" src="imagenes/recompensas.png" alt="Pantalla ilustrada de recompensas">
    <div class="shade" aria-hidden="true"></div>
    <a class="back-button" href="empiezo.html" aria-label="Volver al menú">
      <img src="imagenes/recomp-volver.png" alt="Volver" draggable="false">
    </a>

    <section class="reward-display" aria-live="polite" aria-atomic="true">
      <article class="reward-card" id="reward-card">
        <div class="lock-plate" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M19 28v-9a13 13 0 0 1 26 0v9" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
            <rect x="12" y="27" width="40" height="31" rx="6" fill="currentColor"/>
            <circle cx="32" cy="40" r="4" fill="#f4e4c9"/><path d="m30 42-2 8h8l-2-8" fill="#f4e4c9"/>
          </svg>
        </div>
        <h1 class="reward-name" id="reward-name">Insignia de campeón</h1>
        <p class="reward-description" id="reward-description">Gana una partida para desbloquearla.</p>
        <p class="reward-status" id="reward-status">Cargando recompensas…</p>
      </article>
    </section>

    <button class="claim-hitbox" id="claim-button" type="button" aria-label="Reclamar recompensa">
      <span class="sr-only">Reclamar recompensa</span>
    </button>
  </main>
  <script>
    (() => {
      const rewards = [
        { id: 'insignia-campeon', name: 'Insignia de campeón', description: 'Gana una partida para desbloquearla.', achievement: 'Campeón' },
        { id: 'aura-bronce', name: 'Aura de bronce', description: 'Alcanza 3.000 puntos en una partida.', achievement: 'Puntaje 3.000' },
        { id: 'titulo-leyenda', name: 'Título de leyenda', description: 'Consigue diez victorias.', achievement: 'Diez victorias' },
        { id: 'marco-maestro', name: 'Marco maestro', description: 'Responde correctamente 25 preguntas.', achievement: 'Mente matemática' },
      ];
      const state = new Map(rewards.map((reward) => [reward.id, { unlocked: false, claimed: false }]));
      let activeIndex = 0;
      const card = document.querySelector('#reward-card');
      const name = document.querySelector('#reward-name');
      const description = document.querySelector('#reward-description');
      const status = document.querySelector('#reward-status');
      const claimButton = document.querySelector('#claim-button');

      function render(direction = 'left', message = '') {
        const reward = rewards[activeIndex];
        const rewardState = state.get(reward.id);
        name.textContent = reward.name;
        description.textContent = reward.description;
        status.classList.remove('error');
        status.textContent = message || (rewardState.claimed
          ? 'Recompensa reclamada'
          : rewardState.unlocked
            ? '¡Disponible para reclamar!'
            : `Requiere el logro: ${reward.achievement}`);
        card.classList.remove('slide-left', 'slide-right');
        void card.offsetWidth;
        card.classList.add(direction === 'right' ? 'slide-right' : 'slide-left');
      }

      function feedback(message, isError = false) {
        status.textContent = message;
        status.classList.toggle('error', isError);
      }

      async function readApiJson(response) {
        if (!(response.headers.get('content-type') || '').includes('application/json')) {
          throw new Error('El servidor respondió con HTML en vez de JSON. Ejecuta iniciar_mathoro.bat y abre el juego desde localhost.');
        }
        try { return await response.json(); }
        catch { throw new Error('El servidor envió JSON inválido. Reinicia MATHORO con iniciar_mathoro.bat.'); }
      }

      async function loadRewards() {
        try {
          const response = await fetch('/api/rewards', { credentials: 'same-origin' });
          if (response.status === 401) {
            feedback('Inicia sesión para consultar y reclamar tus recompensas.', true);
            return;
          }
          if (!response.ok) throw new Error('No se pudo consultar el catálogo.');
          const data = await readApiJson(response);
          for (const item of data.rewards || []) {
            if (state.has(item.id)) state.set(item.id, { unlocked: Boolean(item.unlocked), claimed: Boolean(item.claimed) });
          }
          render();
        } catch {
          feedback('No se pudo conectar. Abre el juego desde el servidor para usar las recompensas.', true);
        }
      }

      claimButton.addEventListener('click', async () => {
        const reward = rewards[activeIndex];
        const rewardState = state.get(reward.id);
        if (rewardState.claimed) {
          feedback('Ya reclamaste esta recompensa.');
          return;
        }
        if (!rewardState.unlocked) {
          feedback(`Aún está bloqueada. Requiere el logro: ${reward.achievement}.`, true);
          return;
        }
        claimButton.disabled = true;
        try {
          const response = await fetch('/api/rewards/claim', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rewardId: reward.id }),
          });
          const data = await readApiJson(response);
          if (!response.ok) throw new Error(data.error || 'No se pudo reclamar la recompensa.');
          state.set(reward.id, { ...rewardState, claimed: true });
          render('left', data.alreadyClaimed ? 'Esta recompensa ya estaba reclamada.' : '¡Recompensa reclamada con éxito!');
        } catch (error) {
          feedback(error.message || 'No se pudo reclamar la recompensa.', true);
        } finally {
          claimButton.disabled = false;
        }
      });

      let touchStartX = null;
      document.querySelector('.scene').addEventListener('touchstart', (event) => {
        if (event.touches.length === 1) touchStartX = event.touches[0].clientX;
      }, { passive: true });
      document.querySelector('.scene').addEventListener('touchend', (event) => {
        if (touchStartX === null) return;
        const delta = event.changedTouches[0].clientX - touchStartX;
        if (Math.abs(delta) > 60) {
          activeIndex = (activeIndex + (delta < 0 ? 1 : -1) + rewards.length) % rewards.length;
          render(delta < 0 ? 'left' : 'right');
        }
        touchStartX = null;
      }, { passive: true });

      loadRewards();
    })();
  </script>
</body>
</html>
