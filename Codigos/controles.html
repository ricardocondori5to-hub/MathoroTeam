<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#750d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MATHORO · Controles</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #750d0f;
    }

    .pantalla {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #750d0f;
    }

    .ilustracion {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .volver {
      position: absolute;
      z-index: 3;
      top: 85.5%;
      left: 61.45%;
      width: 7.9%;
      height: 11.7%;
      min-width: 48px;
      min-height: 44px;
      padding: 0;
      border: 0;
      border-radius: 28%;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .16s ease, transform .16s ease;
    }

    .volver:hover { background: #fff4dd0c; }
    .volver:active { transform: scale(.96); }
    .volver:focus-visible { outline: 3px solid #fff2d6; outline-offset: 3px; }

    .solo-lector {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
  <link rel="stylesheet" href="pwa-responsive.css">
  <link rel="stylesheet" href="transiciones.css">
  <script defer src="pwa-runtime.js"></script>
  <script defer src="transiciones.js"></script>
  <script defer src="sonidos-ui.js"></script>
</head>
<body>
  <main class="pantalla">
    <img class="ilustracion" src="imagenes/controles.png" alt="Pantalla de controles: 1. Click izquierdo para seleccionar. Un brazo musculoso aparece a la izquierda." draggable="false">
    <h1 class="solo-lector">Controles</h1>
    <p class="solo-lector">1. Click izquierdo para seleccionar.</p>

    <button class="volver" id="volver" type="button" aria-label="Volver al menú principal" title="Volver al menú principal">
      <span class="solo-lector">Volver al menú principal</span>
    </button>

  </main>

  <script>
    (() => {
      document.getElementById('volver').addEventListener('click', () => {
        window.navegarConFade('index.html');
      });

    })();
  </script>
</body>
</html>
