<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#780e10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MATHORO · Iniciar sesión</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      --tinta: #fff6e7;
      --borde-campo: #e8cda8;
      --marron: #4d291c;
      --rojo: #7a1113;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--rojo);
    }

    body { min-height: 100svh; }

    .escena {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: var(--rojo);
    }

    .arte {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .autenticacion {
      position: absolute;
      z-index: 2;
      top: 20.3%;
      left: 50%;
      width: min(27.2vw, 520px);
      min-width: 260px;
      transform: translateX(-50%);
      color: var(--tinta);
    }

    .pestanas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(5px, .7vw, 12px);
      margin: 0 0 clamp(14px, 2vh, 24px);
      padding: 0 clamp(4px, .45vw, 9px);
    }

    .pestana {
      position: relative;
      min-height: clamp(32px, 4.1vh, 46px);
      border: 0;
      color: #f4ddbd;
      background: transparent;
      font: 700 clamp(12px, 1.05vw, 19px) / 1 Arial, sans-serif;
      letter-spacing: .015em;
      text-shadow: 0 1px 2px #fff4, 0 2px 8px #63371e99;
      cursor: pointer;
      transition: color .18s ease, text-shadow .18s ease, transform .18s ease;
    }

    .pestana::after {
      position: absolute;
      right: 28%;
      bottom: 1px;
      left: 28%;
      height: 2px;
      border-radius: 99px;
      background: #9b613e;
      box-shadow: 0 0 8px #9b613e99;
      content: "";
      opacity: 0;
      transform: scaleX(.55);
      transition: opacity .18s ease, transform .18s ease;
    }

    .pestana:hover { color: #fff6e7; transform: translateY(-2px); }
    .pestana[aria-selected="true"] {
      color: #fff8ed;
      text-shadow: 0 0 3px #fff6, 0 2px 5px #7d482bbb, 0 0 13px #9b613e80;
    }
    .pestana[aria-selected="true"]::after { opacity: .9; transform: scaleX(1); }

    .formulario {
      display: grid;
      grid-template-columns: 1fr;
      align-content: start;
      gap: clamp(10px, 1.45vh, 17px);
      width: 100%;
      padding: 0 clamp(2px, .2vw, 4px);
    }

    .campo { display: grid; gap: clamp(4px, .48vh, 7px); }
    .campo[hidden] { display: none; }

    .campo label {
      color: var(--tinta);
      font-size: clamp(12px, .95vw, 17px);
      font-weight: 700;
      line-height: 1.1;
      text-shadow: 0 1px 4px #290d0a;
    }

    .campo input {
      width: 100%;
      height: clamp(34px, 4.4vh, 49px);
      padding: 0 2px;
      border: 0;
      border-bottom: 2px solid var(--borde-campo);
      border-radius: 0;
      outline: none;
      color: var(--tinta);
      background: transparent;
      font: 500 clamp(13px, 1vw, 17px) / 1 Arial, sans-serif;
      transition: border-color .15s ease, filter .15s ease;
    }

    .campo input::placeholder { color: #fff1d6c9; opacity: 1; }
    .campo input:focus {
      border-bottom-color: #fff;
      filter: drop-shadow(0 2px 4px #fff7);
    }

    .formulario[data-modo="login"] { margin-top: clamp(30px, 5.5vh, 62px); }
    .formulario[data-modo="registro"] { gap: clamp(7px, 1.05vh, 12px); }
    .formulario[data-modo="registro"] .campo { gap: clamp(3px, .35vh, 5px); }
    .formulario[data-modo="registro"] .campo input { height: clamp(31px, 3.75vh, 42px); }

    .accion {
      position: absolute;
      z-index: 3;
      top: 59.25%;
      left: 50%;
      width: min(25.3vw, 486px);
      min-width: 244px;
      height: 7.2%;
      min-height: 44px;
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      color: transparent;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .accion:hover { background: #fff1d20c; }
    .accion:active { transform: translateX(-50%) scale(.98); }
    .accion:focus-visible { outline: 3px solid #fff4df; outline-offset: 3px; }
    .accion .solo-lector { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .etiqueta-accion { display: none; }
    .accion[data-modo="registro"]::before {
      position: absolute;
      inset: 23% 30%;
      border-radius: 999px;
      background: #693b25;
      content: "";
    }
    .accion[data-modo="registro"] .etiqueta-accion {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff5e6;
      font-size: clamp(12px, 1.05vw, 19px);
      font-weight: 800;
      text-shadow: 0 1px 2px #63331e;
    }

    .estado-auth {
      position: absolute;
      z-index: 4;
      top: 68%;
      left: 50%;
      width: max-content;
      max-width: min(88vw, 520px);
      padding: 8px 14px;
      transform: translate(-50%, 8px);
      border: 1px solid #dfbf9580;
      border-radius: 999px;
      color: var(--tinta);
      background: #3d201bea;
      box-shadow: 0 5px 22px #25090766;
      font-size: clamp(12px, .9vw, 16px);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .estado-auth.visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 600px) {
      .autenticacion { width: 31vw; min-width: 0; }
      .accion { width: 29vw; min-width: 0; }
      .accion[data-modo="registro"] .etiqueta-accion { font-size: clamp(9px, 2.3vw, 13px); }
      .pestana { font-size: clamp(9px, 2vw, 13px); }
      .campo label { font-size: clamp(9px, 1.8vw, 13px); }
      .campo input { padding-inline: 2px; font-size: clamp(10px, 1.8vw, 13px); }
      .formulario[data-modo="registro"] .campo input { height: clamp(28px, 3.8vh, 38px); }
      .formulario[data-modo="registro"] { gap: clamp(5px, .8vh, 9px); }
    }

    @media (max-height: 700px) {
      .autenticacion { top: 19.5%; }
      .pestanas { margin-bottom: 8px; }
      .formulario { gap: 7px; }
      .formulario[data-modo="login"] { margin-top: 20px; }
      .formulario[data-modo="registro"] { gap: 5px; }
      .campo input { height: 32px; }
      .formulario[data-modo="registro"] .campo input { height: 29px; }
      .accion { top: 59.25%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
  <link rel="stylesheet" href="pwa-responsive.css">
  <link rel="stylesheet" href="transiciones.css">
  <script defer src="pwa-runtime.js"></script>
  <script defer src="transiciones.js"></script>
  <script defer src="sonidos-ui.js"></script>
</head>
<body>
  <main class="escena">
    <img class="arte" src="imagenes/iniciarmath3.png" alt="Portapapeles con cuernos y un personaje que se asoma desde abajo" draggable="false">

    <section class="autenticacion" aria-label="Acceso a MATHORO">
      <div class="pestanas" role="tablist" aria-label="Tipo de acceso">
        <button class="pestana" id="tab-login" type="button" role="tab" aria-selected="true" aria-controls="formulario">Iniciar sesión</button>
        <button class="pestana" id="tab-registro" type="button" role="tab" aria-selected="false" aria-controls="formulario" tabindex="-1">Registrarse</button>
      </div>

      <form class="formulario" id="formulario" role="tabpanel" aria-labelledby="tab-login" data-modo="login" novalidate>
        <div class="campo" data-campo="usuario">
          <label for="usuario">Usuario o correo</label>
          <input id="usuario" name="usuario" type="text" placeholder="Tu usuario o correo" autocomplete="username" minlength="3" required>
        </div>

        <div class="campo" data-campo="correo" hidden>
          <label for="correo">Correo electrónico</label>
          <input id="correo" name="correo" type="email" placeholder="nombre@ejemplo.com" autocomplete="email" required>
        </div>

        <div class="campo" data-campo="contrasena">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" name="contrasena" type="password" placeholder="Tu contraseña" autocomplete="current-password" minlength="8" required>
        </div>

        <div class="campo" data-campo="confirmar" hidden>
          <label for="confirmar">Confirmar contraseña</label>
          <input id="confirmar" name="confirmar" type="password" placeholder="Repite tu contraseña" autocomplete="new-password" minlength="8" required>
        </div>
      </form>
    </section>

    <button class="accion" id="accion" data-modo="login" type="submit" form="formulario" aria-label="Ingresar"><span class="etiqueta-accion" aria-hidden="true">Registrarse</span><span class="solo-lector">Ingresar</span></button>
    <output class="estado-auth" id="estado-auth" role="status" aria-live="polite"></output>
  </main>

  <script>
    (() => {
      const form = document.getElementById('formulario');
      const tabs = {
        login: document.getElementById('tab-login'),
        registro: document.getElementById('tab-registro')
      };
      const accion = document.getElementById('accion');
      const estado = document.getElementById('estado-auth');
      const campos = Object.fromEntries(
        [...form.querySelectorAll('[data-campo]')].map((grupo) => [grupo.dataset.campo, grupo])
      );
      let modo = 'login';
      function cambiarModo(nuevoModo) {
        modo = nuevoModo;
        const registro = modo === 'registro';
        form.dataset.modo = modo;
        campos.correo.hidden = !registro;
        campos.confirmar.hidden = !registro;
        campos.usuario.querySelector('label').textContent = registro ? 'Nombre de usuario' : 'Usuario o correo';
        campos.usuario.querySelector('input').placeholder = registro ? 'Elige un nombre de usuario' : 'Tu usuario o correo';
        campos.usuario.querySelector('input').autocomplete = registro ? 'username' : 'username';
        campos.contrasena.querySelector('input').autocomplete = registro ? 'new-password' : 'current-password';
        tabs.login.setAttribute('aria-selected', String(!registro));
        tabs.registro.setAttribute('aria-selected', String(registro));
        form.setAttribute('aria-labelledby', registro ? 'tab-registro' : 'tab-login');
        tabs.login.tabIndex = registro ? -1 : 0;
        tabs.registro.tabIndex = registro ? 0 : -1;
        accion.setAttribute('aria-label', registro ? 'Registrarse' : 'Ingresar');
        accion.dataset.modo = modo;
        accion.querySelector('.solo-lector').textContent = registro ? 'Registrarse' : 'Ingresar';
        document.title = registro ? 'MATHORO · Registro' : 'MATHORO · Iniciar sesión';
        estado.classList.remove('visible');
        form.querySelectorAll('input').forEach((input) => input.setCustomValidity(''));
      }

      tabs.login.addEventListener('click', () => cambiarModo('login'));
      tabs.registro.addEventListener('click', () => cambiarModo('registro'));
      Object.entries(tabs).forEach(([nombre, tab], index) => {
        tab.addEventListener('keydown', (event) => {
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
          event.preventDefault();
          const siguiente = index === 0 ? 'registro' : 'login';
          cambiarModo(siguiente);
          tabs[siguiente].focus();
        });
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('contrasena');
        const confirmar = document.getElementById('confirmar');
        confirmar.setCustomValidity(modo === 'registro' && password.value !== confirmar.value
          ? 'Las contraseñas no coinciden.'
          : '');

        if (!form.reportValidity()) return;
        const registro = modo === 'registro';
        const payload = registro
          ? {
              username: document.getElementById('usuario').value.trim(),
              email: document.getElementById('correo').value.trim(),
              password: password.value
            }
          : { identifier: document.getElementById('usuario').value.trim(), password: password.value };
        accion.disabled = true;
        estado.textContent = 'Conectando…';
        estado.classList.add('visible');
        try {
          const response = await fetch(registro ? '/api/register' : '/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify(payload)
          });
          const result = await readApiJson(response);
          if (!response.ok) throw new Error(result.error || 'No se pudo iniciar sesión.');
          estado.textContent = registro ? 'Cuenta creada. Entrando al juego…' : 'Sesión iniciada. Entrando al juego…';
          window.setTimeout(() => { window.navegarConFade('index.html'); }, 120);
        } catch (error) {
          estado.textContent = error instanceof TypeError
            ? 'No se pudo conectar con la API. Comprueba la configuración de Netlify y la base de datos.'
            : error.message;
          accion.disabled = false;
        }
      });

      async function readApiJson(response) {
        if (!(response.headers.get('content-type') || '').includes('application/json')) {
          throw new Error('La API de cuentas no está disponible. En Netlify configura DATABASE_URL con la URL de conexión de PostgreSQL y vuelve a publicar el sitio.');
        }
        try { return await response.json(); }
        catch { throw new Error('La API devolvió una respuesta inválida. Revisa los logs de funciones de Netlify.'); }
      }

    })();
  </script>
</body>
</html>
